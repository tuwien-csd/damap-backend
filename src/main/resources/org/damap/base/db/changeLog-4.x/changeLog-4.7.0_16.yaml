databaseChangeLog:
  - changeSet:
      id: 40
      author: Laura Thaci
      comment: Insert en translations for the configurable footer accessibility statement link
      changes:
        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: sidebar.footer.accessibility-statement.label
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: Accessibility Statement
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-enabled
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: Accessibility statement link enabled
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-enabled-on
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: The accessibility statement link is shown in the sidebar footer.
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-enabled-off
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: The accessibility statement link is hidden in the sidebar footer.
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-url
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: Footer accessibility statement URL
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-save
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: Save
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-remove
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: Remove
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

        - insert:
            tableName: translation
            columns:
              - column:
                  name: translation_key
                  value: admin.instance-config.footer-accessibility-url-empty
              - column:
                  name: language
                  value: en
              - column:
                  name: default_value
                  value: URL cannot be empty. Toggle the option off to hide the link.
              - column:
                  name: active
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 0

      rollback:
        - delete:
            tableName: translation
            where: translation_key = 'sidebar.footer.accessibility-statement.label'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-enabled'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-enabled-on'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-enabled-off'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-url'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-save'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-remove'
        - delete:
            tableName: translation
            where: translation_key = 'admin.instance-config.footer-accessibility-url-empty'
